<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>String Matching Algorithm Visualizer</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    margin:0;
}
.container{
    width:90%;
    max-width:1000px;
    margin:30px auto;
    background:#fff;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}
h1{
    text-align:center;
    color:#1565C0;
}
textarea,input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:6px;
    border:1px solid #ccc;
    font-size:16px;
}
button{
    padding:12px 18px;
    border:none;
    border-radius:6px;
    color:white;
    cursor:pointer;
    margin:5px;
    font-size:16px;
}
.search{background:#1565C0;}
.performance{background:#2E7D32;}
.result{
    background:#E3F2FD;
    padding:15px;
    border-radius:8px;
    margin-top:20px;
}
table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}
table th,table td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}
table th{
    background:#1565C0;
    color:white;
}
</style>
</head>

<body>

<div class="container">

<h1>String Matching Algorithm Comparison</h1>

<label><b>Text</b></label>
<textarea id="text" rows="4">AABAACAADAABAABA</textarea>

<label><b>Pattern</b></label>
<input id="pattern" value="AABA">

<button class="search" onclick="runSearch()">Search</button>
<button class="performance" onclick="performanceTest()">Performance Comparison</button>

<div class="result" id="output"></div>

<div id="tableArea"></div>

</div>

<script>

// ---------- Naive ----------
function naiveSearch(text,pattern){

let matches=[];
let comparisons=0;

for(let i=0;i<=text.length-pattern.length;i++){

let j=0;

while(j<pattern.length){

comparisons++;

if(text[i+j]!=pattern[j]) break;

j++;

}

if(j==pattern.length)
matches.push(i);

}

return {matches,comparisons};

}

// ---------- LPS ----------
function computeLPS(pattern){

let lps=new Array(pattern.length).fill(0);

let len=0;
let i=1;

while(i<pattern.length){

if(pattern[i]==pattern[len]){

len++;
lps[i]=len;
i++;

}

else{

if(len!=0)
len=lps[len-1];

else{
lps[i]=0;
i++;
}

}

}

return lps;

}

// ---------- KMP ----------
function kmpSearch(text,pattern){

let lps=computeLPS(pattern);

let matches=[];

let i=0,j=0;

let comparisons=0;

while(i<text.length){

comparisons++;

if(text[i]==pattern[j]){

i++;
j++;

}

if(j==pattern.length){

matches.push(i-j);

j=lps[j-1];

}

else if(i<text.length && text[i]!=pattern[j]){

if(j!=0)

j=lps[j-1];

else

i++;

}

}

return {matches,comparisons};

}

// ---------- Rabin Karp ----------
function rabinKarp(text,pattern){

let d=256;
let q=101;

let n=text.length;
let m=pattern.length;

let h=1;

for(let i=0;i<m-1;i++)
h=(h*d)%q;

let pHash=0;
let tHash=0;

let comparisons=0;
let matches=[];

for(let i=0;i<m;i++){

pHash=(d*pHash+pattern.charCodeAt(i))%q;

tHash=(d*tHash+text.charCodeAt(i))%q;

}

for(let s=0;s<=n-m;s++){

if(pHash==tHash){

let k;

for(k=0;k<m;k++){

comparisons++;

if(text[s+k]!=pattern[k]) break;

}

if(k==m)
matches.push(s);

}

if(s<n-m){

tHash=(d*(tHash-text.charCodeAt(s)*h)+text.charCodeAt(s+m))%q;

if(tHash<0) tHash+=q;

}

}

return {matches,comparisons};

}

// ---------- Search ----------
function runSearch(){

let text=document.getElementById("text").value;

let pattern=document.getElementById("pattern").value;

let n=naiveSearch(text,pattern);

let k=kmpSearch(text,pattern);

let r=rabinKarp(text,pattern);

document.getElementById("output").innerHTML=`

<h3>Results</h3>

<b>Naive Search</b><br>
Matches : ${n.matches.join(", ")}<br>
Comparisons : ${n.comparisons}<br><br>

<b>KMP Search</b><br>
Matches : ${k.matches.join(", ")}<br>
Comparisons : ${k.comparisons}<br><br>

<b>Rabin-Karp</b><br>
Matches : ${r.matches.join(", ")}<br>
Comparisons : ${r.comparisons}

`;

}

// ---------- Random Text ----------
function randomText(size){

const chars="ABCD";

let txt="";

for(let i=0;i<size;i++)

txt+=chars[Math.floor(Math.random()*4)];

return txt;

}

// ---------- Performance ----------
function performanceTest(){

let text=randomText(10000);

let patterns=["AB","ABCD","ABCDAB","ABCDABCD"];

let html=`

<table>

<tr>

<th>Pattern</th>

<th>Naive Comparisons</th>

<th>KMP Comparisons</th>

<th>RK Comparisons</th>

</tr>

`;

patterns.forEach(p=>{

let n=naiveSearch(text,p);

let k=kmpSearch(text,p);

let r=rabinKarp(text,p);

html+=`

<tr>

<td>${p}</td>

<td>${n.comparisons}</td>

<td>${k.comparisons}</td>

<td>${r.comparisons}</td>

</tr>

`;

});

html+="</table>";

document.getElementById("tableArea").innerHTML=html;

}

runSearch();

</script>

</body>
</html>
